plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.omp.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.omp.chat"
        minSdk 24
        targetSdk 34
        versionCode 99
        versionName "2.10.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The ChatGPT-inspired UI is a separate, side-by-side deliverable. The
    // classic flavour stays untouched, so the existing APK and installation
    // are never replaced by the new frontend.
    flavorDimensions "ui"
    productFlavors {
        classic {
            dimension "ui"
        }
        chstgpt {
            dimension "ui"
            applicationIdSuffix ".superpremium"
            versionCode 202
            versionName "4.0.2-super-premium"
        }
    }

    applicationVariants.all { variant ->
        if (variant.flavorName == "chstgpt") {
            variant.outputs.all { output ->
                output.outputFileName = variant.buildType.name == "release"
                    ? "super-premium.apk"
                    : "super-premium-debug.apk"
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        allWarningsAsErrors = false
    }


    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-graphics:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.5'
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.7.5'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'androidx.webkit:webkit:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

